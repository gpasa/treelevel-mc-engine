# Builds the container image that carries Herwig 7 and Sherpa 3, for the two architectures TreeLevel runs on,
# and publishes it as ghcr.io/<owner>/treelevel-mc-engine.
#
# Each architecture is built on a runner of that architecture — no emulation: Herwig's bootstrap takes an hour
# or two natively and the best part of a day under qemu. The two results are then joined into one tag, so that
# `docker pull` picks the right one by itself.

name: image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: the engine version)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/treelevel-mc-engine

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest; the tag is put together in the next job, once both architectures are in.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # An image that builds is not an image that runs. Everything that cost us a day — libzip4 absent from
      # the runtime stage, a login shell throwing the PATH away, perl-modules missing under calchep_batch —
      # was invisible at build time and obvious at the first run. So it is run here, on a runner of its own
      # architecture, which is the only place where both are exercised natively before anyone downloads them.
      - name: L'image démarre-t-elle, et avec tous ses générateurs
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE@${{ steps.build.outputs.digest }}"
          docker run --rm "$image" capabilities | tee capabilities.json
          for g in passthrough pythia8 herwig7 sherpa3 whizard3 calchep3; do
            grep -q "\"$g\"" capabilities.json || { echo "::error::$g manque dans capabilities"; exit 1; }
          done
        shell: bash

      # And a real job, end to end: Herwig showers and hadronises the 200 events TreeLevel wrote, and the
      # cross section of the input must come out untouched on the other side.
      - name: Un vrai travail, de bout en bout
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE@${{ steps.build.outputs.digest }}"
          docker run --rm -v "$PWD/docker/test-job:/job" "$image" run /job
          cat docker/test-job/status.json
          grep -q '"state": *"finished"' docker/test-job/status.json || { echo "::error::le travail a échoué"; exit 1; }
          grep -q '"eventsWritten": *200' docker/test-job/status.json || { echo "::error::200 événements attendus"; exit 1; }
          grep -q '"crossSection": *3.113986' docker/test-job/status.json || { echo "::error::la section efficace a bougé"; exit 1; }
        shell: bash

      # The bare hexadecimal, without its "sha256:" prefix: a colon is not allowed in an artifact's file name,
      # and the job that joins the architectures puts the prefix back.
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: one tag for both
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The version this image answers to
        id: version
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$tag" ] || [ "$tag" = "$GITHUB_REF_NAME" ]; then
            # Not a tag push: fall back to the version the engine reports.
            tag=$(grep -oE '<Version>[^<]+' win/treelevel-mc/treelevel-mc.csproj | head -1 | cut -d'>' -f2)
          fi
          echo "tag=${tag:-latest}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Join the two architectures under one tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/$IMAGE:${{ steps.version.outputs.tag }}" \
            -t "$REGISTRY/$IMAGE:latest" \
            $(printf "$REGISTRY/$IMAGE@sha256:%s " *)
        shell: bash

      - name: What was published
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE:${{ steps.version.outputs.tag }}"
        shell: bash
